spring.application.name=threatintel-lite
app.analysis.timeout-ms=15000
spring.datasource.url=${DB_URL}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
app.cookie.secure=false
app.cors.allowed-origin=http://localhost:5173
app.analysis.rate-limit.max-requests=5
app.analysis.rate-limit.window-seconds=60
app.auth.login.rate-limit.max-failures=5
app.auth.login.rate-limit.window-seconds=300

app.analysis.drafts.ttl-seconds=900
app.analysis.drafts.max-per-user=5
app.analysis.drafts.max-total=500
app.analysis.drafts.max-snapshot-bytes=131072
